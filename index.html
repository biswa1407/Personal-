<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyConnect | Music & Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#8b5cf6',
                        dark: '#0f172a',
                        panel: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-white font-sans min-h-screen p-4 md:p-8">

    <!-- Navbar -->
    <nav class="max-w-6xl mx-auto flex justify-between items-center mb-10 pb-4 border-b border-gray-800">
        <div class="text-2xl font-black tracking-tighter flex items-center gap-2">
            <i class="fa-solid fa-compact-disc text-brand animate-spin-slow"></i> MelodyConnect
        </div>
        <div class="flex gap-4">
            <button onclick="showMatches()" class="bg-brand/20 text-brand border border-brand/50 px-4 py-2 rounded-full font-semibold hover:bg-brand hover:text-white transition-all">
                <i class="fa-solid fa-users mr-2"></i> My Matches
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Left Column: Music Player -->
        <div class="bg-panel p-8 rounded-3xl shadow-2xl border border-gray-800 flex flex-col items-center">
            <!-- Album Art Cover -->
            <div class="w-64 h-64 bg-gradient-to-br from-brand to-purple-900 rounded-2xl shadow-lg mb-8 flex items-center justify-center overflow-hidden relative group">
                <i class="fa-solid fa-music text-6xl text-white/50 group-hover:scale-110 transition-transform"></i>
                <!-- Simulated progress ring -->
                <div class="absolute inset-0 border-4 border-brand/30 rounded-2xl"></div>
            </div>

            <div class="text-center mb-6">
                <h2 class="text-3xl font-bold">Midnight Synth</h2>
                <p class="text-gray-400 mt-1">The Neon Collective</p>
            </div>

            <!-- Player Controls -->
            <div class="w-full max-w-sm">
                <div class="h-2 bg-gray-700 rounded-full mb-4 overflow-hidden">
                    <div id="progress-bar" class="h-full bg-brand w-1/3 transition-all duration-1000"></div>
                </div>
                <div class="flex justify-between text-xs text-gray-400 mb-6">
                    <span>1:14</span>
                    <span>3:45</span>
                </div>
                <div class="flex justify-center items-center gap-8">
                    <button class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-backward-step"></i></button>
                    <button onclick="togglePlay()" class="w-16 h-16 bg-brand rounded-full flex items-center justify-center hover:bg-purple-500 transition-colors shadow-[0_0_20px_rgba(139,92,246,0.4)]">
